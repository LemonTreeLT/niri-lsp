name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Nix flake check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: niri-lsp
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'LemonTreeLT/niri-lsp' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run flake checks
        run: nix flake check --accept-flake-config
