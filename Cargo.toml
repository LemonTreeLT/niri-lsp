[workspace]
members = ["crates/niri-lsp", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/example/niri-lsp"

[workspace.dependencies]
anyhow = "1.0"
kdl = "4.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
# Keep the workspace compatible with the Rust toolchain shipped by nixpkgs 25.05.
url = "=2.5.4"
